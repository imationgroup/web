services:
  contact-api:
    build: ./backend
    image: imationgroup-contact:prod
    restart: unless-stopped
    ports:
      # Solo localhost → Nginx del host hace proxy a:
      #   - https://api.imationgroup.com/api/contact   (formulario contacto)
      #   - https://imationgroup.com/blog/*            (blog público)
      #   - https://imationgroup.com/admin/*           (admin CMS)
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    volumes:
      # Persistencia de SQLite + uploads del blog fuera del container.
      - /var/imationgroup-blog:/var/imationgroup-blog
      # Read-only mount del sitio estático para que las páginas del blog
      # puedan leer <lang>/index.html y reutilizar la cabecera/pie del
      # site (ver backend/app/blog/chrome.py). Mismo path host=container
      # para que STATIC_ROOT default funcione sin env vars.
      - /home/deploy/apps/imationgroup-web:/home/deploy/apps/imationgroup-web:ro
