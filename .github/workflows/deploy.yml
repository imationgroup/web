name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-imationgroup-web
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run deploy script on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/apps/imationgroup-web
            bash scripts/deploy.sh

  smoke-test:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/smoke-test.py
          sparse-checkout-cone-mode: false
      - run: python3 scripts/smoke-test.py https://imationgroup.com

  lighthouse:
    name: Lighthouse CI (performance + SEO)
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/lighthouserc.json
          sparse-checkout-cone-mode: false
      - uses: treosh/lighthouse-ci-action@12.1.0
        with:
          urls: |
            https://imationgroup.com/en/
            https://imationgroup.com/es/
            https://imationgroup.com/en/services
            https://imationgroup.com/es/projects
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
