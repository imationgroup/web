name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-imationgroup-web
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Azure runners occasionally fail TCP dial to this VPS (i/o timeout
      # on port 22). Retry up to 3 attempts before giving up.
      - name: Run deploy + smoke on VPS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            mkdir -p ~/.ssh
            echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
            ssh -i ~/.ssh/id_deploy -p ${{ secrets.VPS_PORT || 22 }} -o ConnectTimeout=30 \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'set -e; cd ~/apps/imationgroup-web && bash scripts/deploy.sh && echo "▶ Smoke test" && python3 -u scripts/smoke-test.py https://imationgroup.com'

  lighthouse:
    name: Lighthouse CI (performance + SEO)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/lighthouserc.json
          sparse-checkout-cone-mode: false
      - uses: treosh/lighthouse-ci-action@12.1.0
        with:
          urls: |
            https://imationgroup.com/en/
            https://imationgroup.com/es/
            https://imationgroup.com/en/services
            https://imationgroup.com/es/projects
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
